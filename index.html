<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial scale=1.0" />
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js"></script> 
</head>

<body>
    <div class="header">
        <header>
            <h1>AVENGERS CHARACTER SEARCH</h1>
        </header>
    </div>
    
    <div class="container">
        <form id="heroSearch">
            <label for="searchInput">Search by Full Name or Alias</label>
            <br>
            <input
                type="text"
                id="searchInput"
                name="query"
                placeholder="e.g. Captain America or Steve Rogers"
                autocomplete="off"
            >
            <button id="searchBtn">Search</button>
        </form>
        <div id="result" aria-live="polite"></div>
    </div>
</body>

</html>
